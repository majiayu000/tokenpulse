name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build (syntax compilation)
        run: python -m compileall -q speed.py measurement.py test_speed.py test_measurement.py examples
      - name: Test
        run: python -m unittest -v
      - name: Synthetic stream integration (no model requests)
        run: |
          python -m examples.stream_demo > /tmp/tokenpulse-demo.jsonl
          python speed.py --stream /tmp/tokenpulse-demo.jsonl --output /tmp/tokenpulse-report.json
